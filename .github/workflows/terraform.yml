name: Terraform CI/CD

# Pull request -> fmt, validate, plan for dev/test/prod (plan posted on the PR)
# Push to main -> same checks and plans
# Manual run   -> plan, then apply/destroy of ONE environment after approval
#                 in its GitHub Environment (test and prod require a reviewer)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, test, prod]
        default: dev
      action:
        description: Action
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  contents: read

env:
  TF_VERSION: "1.16.2"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: us-east-1

jobs:
  checks:
    name: fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform fmt -check -recursive -diff

      - name: terraform validate (bootstrap + every environment)
        run: |
          set -euo pipefail
          for dir in bootstrap environments/dev environments/test environments/prod; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      - name: No state, plan or credentials tracked by Git
        run: |
          if git ls-files | grep -E '\.tfstate|(^|/)\.terraform/|(^|/)tfplan$|credentials'; then
            echo "::error::Forbidden file tracked by Git"; exit 1
          fi

  plan:
    name: plan (${{ matrix.environment }})
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.environment) || '["dev","test","prod"]') }}
    defaults:
      run:
        working-directory: environments/${{ matrix.environment }}
    env:
      # Learner Lab: no OIDC/IAM roles. Temporary lab credentials are kept in
      # encrypted GitHub Secrets (refreshed with scripts/set-github-secrets.ps1).
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - name: Guard rails
        working-directory: .
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          ACTION: ${{ inputs.action || 'plan' }}
          REF: ${{ github.ref }}
        run: |
          if [ "$ACTION" = "destroy" ] && [ "$ENVIRONMENT" = "prod" ]; then
            echo "::error::Destroying prod from the pipeline is not allowed"; exit 1
          fi
          if [ "$ACTION" != "plan" ] && [ "$REF" != "refs/heads/main" ]; then
            echo "::error::$ACTION is only allowed from the main branch"; exit 1
          fi
          echo "Environment: $ENVIRONMENT | action: $ACTION | ref: $REF"

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -input=false

      - name: terraform validate
        run: terraform validate -no-color

      - name: terraform plan
        id: plan
        env:
          ACTION: ${{ inputs.action || 'plan' }}
        run: |
          set +e
          EXTRA=""
          if [ "$ACTION" = "destroy" ]; then EXTRA="-destroy"; fi
          terraform plan -input=false -lock-timeout=5m -detailed-exitcode -out=tfplan $EXTRA
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then exit 1; fi
          if [ "$code" -eq 2 ]; then echo "has_changes=true" >> "$GITHUB_OUTPUT"; else echo "has_changes=false" >> "$GITHUB_OUTPUT"; fi
          terraform show -no-color tfplan > plan.txt

      - name: Plan summary
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          {
            echo "## Terraform plan: \`$ENVIRONMENT\`"
            echo '```'
            grep -E '^(Plan:|No changes)' plan.txt || true
            echo '```'
            echo "<details><summary>Full plan</summary>"
            echo
            echo '```hcl'
            head -c 60000 plan.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}
          path: |
            environments/${{ matrix.environment }}/tfplan
            environments/${{ matrix.environment }}/plan.txt
            environments/${{ matrix.environment }}/.terraform.lock.hcl
          include-hidden-files: true
          retention-days: 7

      - name: Comment the plan on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        with:
          script: |
            const fs = require('fs');
            const env = process.env.ENVIRONMENT;
            let plan = fs.readFileSync(`environments/${env}/plan.txt`, 'utf8');
            const summary = (plan.match(/^(Plan:.*|No changes\..*)$/m) || ['see full plan'])[0];
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... (truncated, see workflow artifact)';
            const marker = `<!-- tfplan-${env} -->`;
            const body = `${marker}\n### Terraform plan: \`${env}\`\n**${summary}**\n\n<details><summary>Show plan</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n</details>`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const previous = comments.find(c => c.body && c.body.startsWith(marker));
            if (previous) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

  apply:
    name: ${{ inputs.action }} (${{ inputs.environment }})
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.action != 'plan' && needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    # Approval rules (required reviewers) live in this GitHub Environment
    environment: ${{ inputs.environment }}
    concurrency:
      group: terraform-apply-${{ inputs.environment }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: environments/${{ inputs.environment }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the reviewed plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}
          path: environments/${{ inputs.environment }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -input=false

      - name: terraform apply (exact reviewed plan)
        run: terraform apply -input=false -lock-timeout=5m tfplan

      - name: Outputs
        if: inputs.action == 'apply'
        run: |
          {
            echo "## Deployed"
            echo "- Application: $(terraform output -raw alb_url)"
            echo "- Auto Scaling Group: $(terraform output -raw asg_name)"
          } >> "$GITHUB_STEP_SUMMARY"
